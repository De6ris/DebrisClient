dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings loom.layered() {
//        officialMojangMappings()
//        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
//    }
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    //masa
    implementation "com.github.sakura-ryoko:malilib:${project.malilib_version}"
//    compileOnly "com.github.sakura-ryoko:litematica:${project.litematica_version}"
    compileOnly("com.github.sakura-ryoko:litematica:DEV~26.1-SNAPSHOT") {
        exclude group: 'fi.dy.masa.malilib'
    }
//    compileOnly "com.github.sakura-ryoko:itemscroller:${project.itemscroller_version}"
//    compileOnly("com.github.sakura-ryoko:tweakeroo:${project.tweakeroo_version}")
//    compileOnly "com.github.sakura-ryoko:minihud:${project.minihud_version}"

//    compileOnly "maven.modrinth:litematica:0.27.0"
    compileOnly "maven.modrinth:item-scroller:QT3ZdOmj"// 0.31.0 is occupied by lite loader 1.12
    compileOnly "maven.modrinth:tweakeroo:0.28.0"
    compileOnly "maven.modrinth:minihud:0.39.0"


    //curse
    compileOnly "curse.maven:roughly-enough-items-${project.rei_projectid}:${project.rei_fileid}"
    compileOnly "curse.maven:worldedit-${project.worldedit_projectid}:${project.worldedit_fileid}"
    compileOnly "curse.maven:advanced-xray-fabric-edition-${project.xray_projectid}:${project.xray_fileid}"
    compileOnly "curse.maven:wthit-${project.wthit_projectid}:${project.wthit_fileid}"
//    compileOnly "curse.maven:carpet-${project.carpet_projectid}:${project.carpet_fileid}"


    //misc
    compileOnly "com.terraformersmc:modmenu:${project.mod_menu}"

    implementation("dev.xpple:clientarguments:${project.clientarguments_version}")

    include(implementation("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))

//    compileOnly("io.github.cottonmc:LibGui:${project.libgui_version}")
    compileOnly(files("remaplibs/remap-LibGui-15.1.0+1.21.11.jar"))

//    compileOnly("mezz.jei:jei-1.21.11-fabric-api:${jei_version}")
    compileOnly(files("remaplibs/remap-jei-1.21.11-common-api-27.4.0.15.jar"))

    //local
    compileOnly(files("libs\\CommandGUIButtons-mc1.21-2.3.0+build.235+bb785b5.jar"))
    compileOnly(files("libs\\Xaeros_Minimap_25.2.14_Fabric_1.21.9.jar"))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    version += "-mc" + project.minecraft_version + "-" + new SimpleDateFormat("yyyyMMdd").format(new Date())
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/DebrisClient.accesswidener")
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

tasks.named('runClient', JavaExec).configure { exec ->
    exec.setArgs(['--username', 'De6ris'])
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
