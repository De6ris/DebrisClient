import java.text.SimpleDateFormat

plugins {
    alias(libs.plugins.loom)
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
//    maven { url = 'https://masa.dy.fi/maven' }
    maven { url = "https://www.cursemaven.com" }
    maven {
        url = "https://maven.terraformersmc.com/releases/"
        content { includeGroupAndSubgroups("com.terraformersmc") }
    }
    maven {
        url "https://staging.alexiil.uk/maven/"
        content {
            includeGroup "io.github.cottonmc"
        }
    }
    maven {
        url 'https://maven.fallenbreath.me/releases'
    }
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url = 'https://maven.xpple.dev/maven2'
    }
    maven {
        url = "https://maven.bawnorton.com/releases"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api


    // dependencies
    implementation libs.malilib
//    include(implementation(libs.conditionalmixin))
    include(implementation("me.fallenbreath:conditional-mixin-fabric:${libs.versions.conditionalmixin.get()}"))


    // compile only
    compileOnly libs.clientarguments
    compileOnly libs.modmenu
    compileOnly libs.libgui

    compileOnly(libs.itemscroller) {
        transitive = false
    }
    compileOnly(libs.tweakeroo) {
        transitive = false
    }
    compileOnly(libs.litematica) {
        transitive = false
    }
    compileOnly(libs.minihud) {
        transitive = false
    }

    compileOnly "curse.maven:roughly-enough-items-${project.rei_projectid}:${project.rei_fileid}"
    compileOnly "curse.maven:worldedit-${project.worldedit_projectid}:${project.worldedit_fileid}"
    compileOnly "curse.maven:wthit-${project.wthit_projectid}:${project.wthit_fileid}"
//    compileOnly "curse.maven:carpet-${project.carpet_projectid}:${project.carpet_fileid}"
    compileOnly libs.jei.api
    compileOnly libs.xray
//    compileOnly libs.commandbutton
    compileOnly libs.xaerominimap

    compileOnly(files("libs\\CommandGUIButtons-mc1.21-2.3.0+build.235+bb785b5.jar"))


    // runtime test
    localRuntime libs.clientarguments
    localRuntime libs.modmenu
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", libs.versions.minecraft.get()
    inputs.property "loader_version", libs.versions.fabric.loader.get()
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": libs.versions.minecraft.get(),
                "loader_version": libs.versions.fabric.loader.get()
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    version += "-mc${libs.versions.minecraft.get()}-${new SimpleDateFormat("yyyyMMdd").format(new Date())}"
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/debrisclient.accesswidener")
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

tasks.named('runClient', JavaExec).configure { exec ->
    exec.setArgs(['--username', 'De6ris'])
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
